name: CI

on:
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    # ✅ CI 러너 안에서 PostgreSQL을 서비스 컨테이너로 같이 띄움
    services:
      postgres:
        image: postgis/postgis:16-3.4
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: baegopang
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        # ✅ DB가 '준비됨' 상태까지 기다릴 수 있게 health check
        options: >-
          --health-cmd="pg_isready -U postgres -d baegopang"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    # ✅ Spring이 테스트에서 DB로 붙도록 환경변수로 주입
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/baegopang
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # 테스트가 스키마 자동생성에 기대지 않게 조정하고 싶을 때
      # SPRING_JPA_HIBERNATE_DDL_AUTO: validate

    steps:
      # --------------------
      # 1) 소스 체크아웃
      # --------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------
      # 2) JDK 세팅
      # --------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # --------------------
      # 3) gradlew 실행권한 부여 (리눅스에서 필요)
      # --------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --------------------
      # 4) PostgreSQL 클라이언트 설치 (pg_isready 사용)
      # --------------------
      - name: Install PostgreSQL client (EN/KR)
        run: |
          echo "📦 Installing PostgreSQL client... / PostgreSQL 클라이언트 설치 중..."
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # --------------------
      # 5) (로그) CI 환경 정보 출력
      # --------------------
      - name: Print environment info (EN/KR)
        run: |
          echo "✅ CI started / CI 시작"
          echo "📌 Java version / 자바 버전"
          java -version
          echo "📌 Gradle wrapper / 그레이들 래퍼"
          ./gradlew --version

      # --------------------
      # 6) (로그) DB 준비 상태 확인
      # --------------------
      - name: Wait for PostgreSQL (EN/KR)
        run: |
          echo "⏳ Waiting for PostgreSQL... / PostgreSQL 준비 대기중..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d baegopang; then
              echo "✅ PostgreSQL is ready / PostgreSQL 준비 완료"
              exit 0
            fi
            echo "… not ready yet ($i/30) / 아직 준비 안됨 ($i/30)"
            sleep 2
          done
          echo "❌ PostgreSQL not ready / PostgreSQL 준비 실패"
          exit 1
        env:
          PGPASSWORD: postgres

      # --------------------
      # 7) 테스트 실행 (여기서 Flyway+DB 연결까지 검증)
      # --------------------
      - name: Test (EN/KR)
        run: |
          echo "🧪 Running tests... / 테스트 실행 중..."
          ./gradlew test --no-daemon

      # --------------------
      # 8) 빌드 실행 (테스트는 이미 했으니 -x test)
      # --------------------
      - name: Build (EN/KR)
        run: |
          echo "🏗️ Building artifact... / 빌드 진행 중..."
          ./gradlew build -x test --no-daemon