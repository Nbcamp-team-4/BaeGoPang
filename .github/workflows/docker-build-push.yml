name: Docker Build & Push (GHCR)

on:
  push:
    branches: ["develop"]

permissions:
  contents: read
  packages: write

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      # 1) 소스 체크아웃
      - name: Checkout (EN/KR)
        uses: actions/checkout@v4

      # 2) (디버그) nginx 디렉토리 확인
      - name: Check nginx directory (EN/KR)
        run: |
          echo "📁 repo root"
          ls -la
          echo "📁 intra"
          ls -la intra || true
          echo "📁 infra"
          ls -la infra || true
          echo "🔎 dockerfiles"
          find . -maxdepth 4 -type f -name Dockerfile

      # 3) 빌드 환경 세팅 (JDK 21)
      - name: Set up JDK 21 (EN/KR)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 4) gradlew 실행권한 부여
      - name: Grant execute permission for gradlew (EN/KR)
        run: chmod +x gradlew

      # 5) (로그) 빌드 정보 출력
      - name: Print build info (EN/KR)
        run: |
          echo "✅ Docker Build & Push 시작 / Start"
          echo "📌 Java version / 자바 버전"
          java -version
          echo "📌 Gradle version / 그레이들 버전"
          ./gradlew --version

      # 6) 빌드 (테스트는 생략)
      - name: Build (EN/KR)
        run: |
          echo "🏗️ Gradle 빌드 진행 / Building..."
          ./gradlew clean build -x test --no-daemon

      # 7) GHCR 로그인 (PAT)
      - name: Login to GHCR (EN/KR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # 8) Buildx 세팅
      - name: Set up Docker Buildx (EN/KR)
        uses: docker/setup-buildx-action@v3

      # 9) API 이미지 빌드 & 푸시
      - name: Build and Push API Image (EN/KR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/nbcamp-team-4/baegopang-api:dev-latest
            ghcr.io/nbcamp-team-4/baegopang-api:dev-${{ github.sha }}

      # 10) Nginx 이미지 빌드 & 푸시
      - name: Build and Push Nginx Image (EN/KR)
        uses: docker/build-push-action@v6
        with:
          context: ./intra/nginx
          file: ./intra/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/nbcamp-team-4/baegopang-nginx:dev-latest
            ghcr.io/nbcamp-team-4/baegopang-nginx:dev-${{ github.sha }}