spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}