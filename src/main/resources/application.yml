spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

# AWS S3 설정 (S3 사용 시 필수)
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    stack:
      auto: false

# 파일 저장 방식 선택
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}  # local 또는 s3
  upload-dir: review
jwt:
  # 환경 변수 JWT_SECRET을 jwt.secret에 매핑
  secret: ${JWT_SECRET}
  # 아래 값들도 @Value로 쓰이고 있으므로 반드시 설정이 필요합니다.
  # (환경 변수로 따로 설정하지 않았다면 아래처럼 직접 숫자를 넣으세요)
  access-token-expiration-seconds: 3600 # 1시간
  refresh-token-expiration-seconds: 1209600 # 14일# 로컬은 폴더명, S3는 버킷 내 경로로 사용