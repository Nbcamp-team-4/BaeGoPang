spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/baegopang
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev-seed

  jpa:
    show-sql: true

toss:
  payments:
    secret-key: test_sk_dummy
    base-url: https://api.tosspayments.com

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.context.config: DEBUG